version: '3.8'

services:
  backend:
    build: .
    container_name: ar-backend
    ports:
      - "5001:5000"
    volumes:
      - ./artwork.db:/app/artwork.db
      - ./images:/app/images
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=your-production-secret-key-change-this
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: ar-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped